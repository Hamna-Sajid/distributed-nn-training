master:
  host: localhost
  port: 5000
  n_workers: 2
  n_epochs: 10
  lr: 0.01
  benchmark_matrix_size: 100

data:
  n_samples: 10000
  test_size: 0.1
  random_state: 42

workers:
  artificial_delays:
    - 0.0
    - 2.0

logging:
  training_log_path: logs/training_log.csv
  run_summary_path: logs/last_run_summary.json

benchmark:
  sample_sizes:
    - 10000
    - 15000
    - 20000
  repeats: 1
  master_startup_wait_sec: 1.5
  results_csv_path: logs/benchmark_results.csv
