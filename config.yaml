# =============================================================================
# config.yaml — Global settings for distributed-nn-training
#
# Every module reads from this file via config_loader.py.
# Change values here instead of editing source files.
# =============================================================================

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  input_dim:  784
  hidden_dim: 2048
  output_dim: 10
  num_hidden_layers: 3
  lr:         0.01

# ── Training ──────────────────────────────────────────────────────────────────
training:
  n_epochs:  10
  n_workers: 2

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  name:         mnist
  n_samples:    10000
  test_split:   0.1
  random_state: 42

# ── Communication ─────────────────────────────────────────────────────────────
communication:
  host:        localhost
  port:        5000
  timeout_sec: 300

# ── Benchmark suite ───────────────────────────────────────────────────────────
benchmark:
  sample_sizes: [10000, 20000, 40000, 60000]
  n_epochs_per_run: 5
  port_start: 5100

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  logs_dir:       logs
  graphs_dir:     graphs
  benchmark_dir:  benchmark_results